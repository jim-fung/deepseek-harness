# Replay counterpart to the memory-tools scenario. It includes the base
# `cordis.yml` directly — a config patch cannot target an entry behind a nested
# include — disables the key-requiring DeepSeek adapter, and inserts
# `llm-replay` to serve the recorded JSONL without a key or network. The memory
# rows mount the seam, the supermemory provider pointed at the in-test wire
# server (the port is dynamic, so configuration carries only the env
# reference), and the model-facing memory tools with profile recall.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
          - id: memory
            name: '@deepseek-ai/dsh-memory'
          - id: memory-provider
            name: '@deepseek-ai/dsh-memory-supermemory'
            config:
              baseURL: !!js process.env.DSH_SNAPSHOT_MEMORY_URL
              apiKeyEnv: SUPERMEMORY_API_KEY
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
