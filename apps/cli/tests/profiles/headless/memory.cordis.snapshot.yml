# Replay counterpart to the memory-tools scenario. It includes the base
# `cordis.yml` directly — a config patch cannot target an entry behind a nested
# include — and restates the advanced overlay (the agent and persistence
# configs plus the code-runtime and tool-cordis inserts) so the whole app
# config lives in one patch. It disables the key-requiring DeepSeek adapter and
# inserts `llm-replay` to serve recorded JSONL without a key or network. The
# memory rows mount the seam, the supermemory provider pointed at the in-test
# wire server (the port is dynamic, so configuration carries only the env
# reference), and the model-facing memory tools with profile recall.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are headless-agent, a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - id: persistence
        name: '@deepseek-ai/dsh-session-persistence-jsonl'
        config:
          root: './.sessions'
          # Replay fixtures are raw JSONL; the whole-config patch must restate
          # the compression choice or the default zstd frames hide the logs.
          compression: none
      - insert:
          - id: code-runtime
            name: '@deepseek-ai/dsh-code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@deepseek-ai/dsh-cordis-host-runner'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: llm-replay
            name: '@deepseek-ai/dsh-llm-replay'
          - id: memory
            name: '@deepseek-ai/dsh-memory'
          - id: memory-provider
            name: '@deepseek-ai/dsh-memory-supermemory'
            config:
              baseURL: !!js process.env.DSH_SNAPSHOT_MEMORY_URL
              apiKeyEnv: SUPERMEMORY_API_KEY
          - id: tool-memory
            name: '@deepseek-ai/dsh-tool-memory'
