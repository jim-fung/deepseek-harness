# Replay counterpart to the memory-tools scenario, following the goal patch:
# the product runner rows stay disabled (the test driver owns the run), the
# key-requiring DeepSeek adapter is disabled, and `llm-replay` is inserted to
# serve the recorded JSONL without a key or network. The memory rows mount the
# seam, the supermemory provider pointed at the in-test wire server (the port
# is dynamic, so configuration carries only the env reference), and the
# model-facing memory tools with profile recall.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
    - id: memory
      name: '@deepseek-ai/dsh-memory'
    - id: memory-provider
      name: '@deepseek-ai/dsh-memory-supermemory'
      config:
        baseURL: !!js process.env.DSH_SNAPSHOT_MEMORY_URL
        apiKeyEnv: SUPERMEMORY_API_KEY
    - id: tool-memory
      name: '@deepseek-ai/dsh-tool-memory'
